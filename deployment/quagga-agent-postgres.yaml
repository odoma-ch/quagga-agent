primary:
  resources:
    limits:
      cpu: '1'
      memory: '2000Mi'
    requests:
      cpu: '500m'
      memory: '1000Mi'
  persistence:
    enabled: true
    storageClass: "standard"
    size: 10Gi
  podAnnotations:
    backup.velero.io/backup-volumes: data
  tls:
    enabled: true
    autoGenerated: true
auth:
  enablePostgresUser: true
  postgresPassword: ""
  username: graphchat_user
  password: ""
  database: "graphchat"

