kind: Deployment
apiVersion: apps/v1
metadata:
  name: quagga-agent-webui
  namespace: graphia-app1-staging
  labels:
    app: quagga-agent-webui
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: quagga-agent-webui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        app: quagga-agent-webui
    spec:
      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-pvc
        - name: open-webui-static
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: quagga-agent-webui-nginx-config
            defaultMode: 420
      containers:
        - name: nginx
          image: 'quay.io/nginx/nginx-unprivileged:latest'
          ports:
            - containerPort: 8081
              protocol: TCP
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
        - name: quagga-agent-webui
          image: 'ghcr.io/open-webui/open-webui:v0.10.2'
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: WEBUI_URL
              value: 'https://quagga-agent.graphia-ssh.eu'
            - name: WEBUI_SECRET_KEY
              value: 93xJD4e1rxTI1YVh
            - name: WEBUI_AUTH_TRUSTED_EMAIL_HEADER
              value: X-User-Email
            - name: WEBUI_AUTH_TRUSTED_NAME_HEADER
              value: X-User-Name
            - name: BYPASS_MODEL_ACCESS_CONTROL
              value: 'true'
            - name: DEFAULT_USER_ROLE
              value: user
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
            - name: open-webui-static
              mountPath: /app/backend/open_webui/static
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
 
