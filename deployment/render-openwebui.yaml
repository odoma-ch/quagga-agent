services:
  - type: web
    name: graphchat-open-webui
    runtime: image
    image:
      url: ghcr.io/open-webui/open-webui:main
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: open-webui-data
      mountPath: /app/backend/data
      sizeGB: 5
    envVars:
      - key: PORT
        value: "8080"
      - key: WEBUI_URL
        sync: false
      - key: WEBUI_SECRET_KEY
        generateValue: true
      - key: WEBUI_AUTH_TRUSTED_EMAIL_HEADER
        value: "X-User-Email"
      - key: WEBUI_AUTH_TRUSTED_NAME_HEADER
        value: "X-User-Name"
      - key: BYPASS_MODEL_ACCESS_CONTROL
        value: "true"
      - key: DEFAULT_USER_ROLE
        value: "user"
      - key: DATA_DIR
        value: /app/backend/data
